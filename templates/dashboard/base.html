{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Air Quality Prediction System — Real-time AQI monitoring and ML-powered predictions for Kathmandu">
    <title>{% block title %}Dashboard{% endblock %} — AQI Prediction System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">🌍</span>
            <span class="nav-title">AQI Prediction System</span>
        </div>
        <div class="nav-links">
            <a href="{% url 'dashboard:index' %}" class="nav-link active">Dashboard</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Air Quality Prediction System &mdash; Kathmandu (27.72°N, 85.32°E)</p>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
